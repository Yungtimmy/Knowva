<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Knowva</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="tokens.css"><style>
:root{--kn-cream:#F7F4EC;--kn-cream-dot:#E4DFD2;--kn-surface:#FFFDF8;--kn-ink:#1C1B19;--kn-ink-2:#4A4740;--kn-line:#E8E3D6;--kn-orange:#FF4A1C}
*{box-sizing:border-box;margin:0}body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Poppins,system-ui,sans-serif;color:var(--kn-ink);background:var(--kn-cream) radial-gradient(var(--kn-cream-dot) 1.4px,transparent 1.5px) 0 0/22px 22px;overflow:hidden;position:relative}
.float{position:absolute;animation:bob 6s ease-in-out infinite}.f1{top:8%;left:6%}.f2{bottom:10%;right:6%;animation-delay:-2s}.f3{top:14%;right:12%;animation-delay:-4s}@keyframes bob{50%{transform:translateY(-10px)}}
.card{position:relative;z-index:2;width:100%;max-width:400px;background:var(--kn-surface);border:1px solid var(--kn-line);border-radius:28px;padding:36px 28px;text-align:center;box-shadow:0 20px 40px -24px rgba(60,40,10,.35)}
.clouds{display:flex;justify-content:center;margin-bottom:16px}.clouds svg{margin:0 -8px}
.logo{font-weight:600;font-size:22px;color:var(--kn-orange);text-decoration:none}h1{font-size:28px;font-weight:600;margin:14px 0 6px;letter-spacing:-.02em}.sub{color:var(--kn-ink-2);margin-bottom:28px}
.google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:15px 20px;border-radius:999px;background:#fff;border:1.5px solid var(--kn-ink);color:var(--kn-ink);font:600 16px Poppins,sans-serif;text-decoration:none;cursor:pointer;box-shadow:0 4px 0 var(--kn-ink);transition:transform .12s,box-shadow .12s}.google:hover{transform:translateY(2px);box-shadow:0 2px 0 var(--kn-ink)}.google:active{transform:translateY(4px);box-shadow:none}
.swap{margin-top:22px;color:var(--kn-ink-2);font-size:14px}.swap a{color:var(--kn-ink);font-weight:600;text-decoration:none}.fine{margin-top:18px;font-size:12px;color:#7A766C}
