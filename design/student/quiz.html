<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz · Knowva</title><link rel="stylesheet" href="student.css"><style>.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--kn-line);background:var(--kn-surface);font:500 15px var(--kn-font);color:var(--kn-ink);cursor:pointer;transition:transform .1s}.opt:active{transform:scale(.98)}.opt.right{border-color:#2E7D4F;background:#E5F2EA}.opt.wrong{border-color:var(--kn-orange);background:var(--kn-orange-soft)}.why{margin-top:12px;padding:12px;border-radius:12px;background:var(--kn-cream);font-size:14px}</style></head><body><main class="app"><p class="meta">Practice quiz · not graded as a test</p><header class="top"><a class="logo" href="dashboard.html"><svg width="18" height="12" viewBox="0 0 22 14"><path d="M11 0 22 5 11 10 0 5Z" fill="#FF4A1C" transform="rotate(-14 11 5)"/><path d="M5 8v4h10V8" fill="#FF4A1C" transform="rotate(-14 11 5)"/></svg>Knowva</a><div class="avatar">AO</div></header>
<a class="back" href="dashboard.html">← Home</a>
<section style="margin:12px 0"><p class="meta">Prompt engineering · Few-shot</p><div class="row"><h1 id="qn">Question 1 of 4</h1><span class="chip" id="sc">Score 0</span></div><div class="bar" style="margin-top:10px"><i id="pb" style="width:25%;background:var(--kn-orange)"></i></div></section>
<section id="qbox" class="card"></section>
<section id="done" class="card" hidden></section></main><nav class="tabbar"><a href="dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/></svg>Home</a><a href="tutors.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/></svg>Tutors</a><a href="learn.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8M8 11h6"/></svg>Learn</a><a href="test-centre.html" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><path d="M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/><path d="m9 14 2 2 4-4"/></svg>Tests</a><a href="progress.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</a></nav><script>const Q=[["Where does a system prompt sit relative to the user message?",["After the answer","Above the user message","Inside the temperature setting","In the answer key"],1,"The system prompt sets the rules before the user turn is read."],
["What is a few-shot example?",["A longer system prompt","A hidden answer key","An example of input and output in the prompt","A database index"],2,"Few-shot means you show a small number of input and output pairs."],
["If the system prompt and the user message conflict, what should the model prefer?",["The system prompt","The latest joke","A random option","The user's request to ignore the rules"],0,"The system rules win. A user turn cannot overwrite them."],
["What does temperature change?",["The answer key","How random the next tokens are","The course the tutor is locked to","The student's password"],1,"Temperature changes how random the next token choice is. It does not change the rules."]];
let i=0,s=0,miss=[];
function show(){const[q,o]=Q[i];qn.textContent=`Question ${i+1} of ${Q.length}`;pb.style.width=(i+1)/Q.length*100+'%';
qbox.innerHTML=`<h2>${q}</h2>`+o.map((x,k)=>`<button class="opt" data-k="${k}">${x}</button>`).join('')+'<div id="fb"></div>';
qbox.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));}
function pick(k){const[q,o,a,w]=Q[i];qbox.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j==a)b.classList.add('right');else if(j==k)b.classList.add('wrong')});
if(k==a)s++;else miss.push(i);sc.textContent='Score '+s;
fb.innerHTML=`<p class="why"><b>${k==a?'Correct.':'Not quite.'}</b> ${w}</p><button class="btn btn-primary btn-block" style="margin-top:14px" id="nx">${i<Q.length-1?'Next question':'See results'}</button>`;nx.onclick=next}
function next(){if(++i<Q.length)return show();qbox.hidden=true;done.hidden=false;qn.textContent='Done';
done.innerHTML=`<h2>You scored ${s} of ${Q.length}</h2><p class="meta">Saved to Photosynthesis on your dashboard</p>`+(miss.length?'<h3 style="margin-top:14px">Review what you missed</h3>'+miss.map(m=>`<div class="why"><b>${Q[m][0]}</b><br>Answer: ${Q[m][1][Q[m][2]]}. ${Q[m][3]}</div>`).join(''):'<p style="margin-top:10px">Every answer right. Try a harder set next.</p>')+'<div class="two" style="margin-top:16px"><a class="btn btn-ghost" href="tutor.html">Ask tutor</a><a class="btn btn-primary" href="quiz.html">Try again</a></div>'}
show();if(location.hash=='#review'){pick(2);next();pick(2);next();pick(0);next();pick(0);next();}</script></body></html>
