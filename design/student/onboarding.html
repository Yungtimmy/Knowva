<section class="hello"><h1>Tell us about you</h1><p>This takes a minute. Your tutors use it to pitch lessons at the right level.</p></section>

<label class="field"><span>Username</span><input required name="username" pattern="[a-z0-9_.]{3,20}" placeholder="e.g. tolu_ade"><small class="meta">Shown on your profile. Lowercase letters, numbers, _ or .</small></label>
<label class="field"><span>Age</span><input required type="number" min="10" max="99" name="age" inputmode="numeric"></label>
<div class="field"><span>What do you want to learn</span><div id="picked" class="chips" style="min-height:8px"></div>
<input id="q" type="search" placeholder="Search courses, e.g. CSC 205, React, Statistics" autocomplete="off">

-c="Tech" aria-pressed="false">Product Management</button><button type="button" class="chip" data-c="Tech" aria-pressed="false">Blockchain</button><button type="button" class="chip" data-c="Computer science" aria-pressed="false">CSC 101 Introduction to Computing</button><button type="button" class="chip" data-c="Computer science" aria-pressed="false">CSC 201 Computer Programming I</button><button type="button" class="chip" data-c="Computer science" aria-pressed="false">CSC 202 Computer Programming II</button><button type="button" class="chip" data-c="Computer science" aria-pressed="false">CSC 205 Data Structures</button><button type="button" class="chip" data-c="Computer science" aria-pressed="false">CSC 301 Algorithms</button><button type="button" class="chip" data-c="Computer science" aria-pressed="false">CSC 303 Operating Systems</button><button type="button" class="chip" data-c="Computer science" aria-pressed="false">CSC 305 Computer Networks</button><button type="button" class="chip" data-c="Computer science" aria-pressed="false">CSC 307 Database Systems</button><button type="button" class="chip" data-c="Computer science" aria-pressed="false">CSC 401 Compiler Construction</button><button type="button" class="chip" data-c="Computer science" aria-pressed="false">CSC 405 Human-Computer Interaction</button><button type="button" class="chip" data-c="Computer science" aria-pressed="false">Computer Architecture</button><button type="button" class="chip" data-c="Computer science" aria-pressed="false">Theory of Computation</button><button type="button" class="chip" data-c="Computer science" aria-pressed="false">Discrete Mathematics</button><button type="button" class="chip" data-c="FUNAAB and university" aria-pressed="false">SEN 201 Software Engineering</button><button type="button" class="chip" data-c="FUNAAB and university" aria-pressed="false">SEN 301 Software Requirements</button><button type="button" class="chip" data-c="FUNAAB and university" aria-pressed="false"> <style>.chip[aria-pressed=true]{background:#FFE3D8;border-color:#FF4A1C;color:#C7360F}#picked .chip::after{content:" ×"}</style>
<script>
const L=document.getElementById('list'),P=document.getElementById('picked'),Q=document.getElementById('q'),N=document.getElementById('none');
L.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;if(b.getAttribute('aria-pressed')==='true')return unpick(b.textContent);b.setAttribute('aria-pressed','true');const p=document.createElement('button');p.type='button';p.className='chip';p.setAttribute('aria-pressed','true');p.textContent=b.textContent;p.onclick=()=>unpick(b.textContent);P.append(p)});
function unpick(t){[...P.children].forEach(c=>c.textContent===t&&c.remove());[...L.children].forEach(c=>c.textContent===t&&c.setAttribute('aria-pressed','false'))}
Q.addEventListener('input',()=>{const q=Q.value.toLowerCase().replace(/\s+/g,'');let n=0;[...L.children].forEach(c=>{const m=(c.textContent+c.dataset.c).toLowerCase().replace(/\s+/g,'').includes(q);c.hidden=!m;n+=m});N.hidden=n>0});
function ok(){if(!P.children.length){document.getElementById('hint').style.color='#C7360F';Q.focus();return false}return true}
</script></body></html>
